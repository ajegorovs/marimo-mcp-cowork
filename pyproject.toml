[project]
name = "marimo-inspect"
version = "0.2.0"
description = "A FastMCP server and Python client for inspecting and editing live marimo notebooks"
readme = "README.md"
authors = [
    { name = "aleksandrs jegorovs", email = "aleksandrs.jegorovs@lu.lv" },
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.0",
    "httpx2>=2.5.0",
    "marimo[recommended]>=0.24.0",
]

[project.scripts]
marimo-inspect = "marimo_inspection.server:main"

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "inline-snapshot",
    "dirty-equals",
]

[tool.ruff]
# Notebook fixtures, the virtualenv, and third-party files are not linted.
exclude = ["notebooks/", ".venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests requiring a real marimo kernel (deselect with '-m \"not live\"')",
]

[tool.ruff.lint]
extend-select = ["I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marimo_inspection"]

[tool.hatch.build.targets.sdist]
include = ["src/marimo_inspection", "README.md", "LICENSE", "pyproject.toml"]
