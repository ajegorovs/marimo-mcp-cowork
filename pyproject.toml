[project]
name = "marimo-inspect"
version = "0.3.3"
description = "A FastMCP server and Python client for inspecting and editing live marimo notebooks"
readme = "README.md"
authors = [
    { name = "aleksandrs jegorovs", email = "aleksandrs.jegorovs@lu.lv" },
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.0",
    "httpx2>=2.5.0",
    # Private marimo APIs used by the templates/lint (see docs/marimo-version-support.md):
    # upper bound = tested range; running a newer marimo requires widening it after the live suite passes.
    "marimo[recommended]>=0.24.0,<0.25",
    # Demo notebooks + the MCP demo runbook (docs/agent-onboarding-demo-mcp.md)
    # import these; marimo[recommended] does not. Without them the demo fails at
    # its first run step with `ModuleNotFoundError: No module named 'numpy'`.
    "numpy",
    "matplotlib",
    # Distributed anywidget components (src/marimo_inspection/widgets). Kept
    # as regular deps so widgets import out of the box; the base package lazy
    # imports them, so the client path stays free of these until requested.
    "anywidget>=0.11.0",
    "traitlets",
    "pillow",
]

[project.scripts]
marimo-inspect = "marimo_inspection.server:main"

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "inline-snapshot",
    "dirty-equals",
]

[tool.ruff]
# Notebook fixtures and examples, the virtualenv, and third-party files are not
# linted: marimo's generated cell shape (bare trailing expression, closing
# `return`) is correct for a notebook and trips B018/PLR1711 by design.
exclude = ["notebooks/", "examples/", ".venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests requiring a real marimo kernel (deselect with '-m \"not live\"')",
]

[tool.ruff.lint]
extend-select = ["I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marimo_inspection"]

[tool.hatch.build.targets.sdist]
include = ["src/marimo_inspection", "README.md", "LICENSE", "pyproject.toml"]
